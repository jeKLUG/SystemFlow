services:
  web:
    build: .
    image: systemhaus-ess:latest
    container_name: systemhaus-ess
    ports:
      - "${SYSTEMHAUS_PORT:-8081}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_PATH: /data/systemhaus.sqlite
      UPLOAD_DIR: /data/uploads
      WEB_DIST: /app/apps/web/dist
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-secret-key}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    volumes:
      - systemhaus-data:/data
    restart: unless-stopped

volumes:
  systemhaus-data:
